title: Random
---

<script>
    function gotoEntryPage(rel_path) {
        window.location.href = "{{ '/entries/' | htmlBaseUrl }}" + rel_path;
    }

    function getRandomIntInclusive(min, max) {
        const minCeiled = Math.ceil(min);
        const maxFloored = Math.floor(max);
        return Math.floor(Math.random() * (maxFloored - minCeiled + 1) + minCeiled);
    }

    function slugify(str) {
        return str
            .toLowerCase()
            .trim()
            .normalize('NFD')
            .replace(/[\u0300-\u036f]/g, '')
            .replace(/[^a-z0-9 -]/g, '')
            .replace(/\s+/g, '-')
            .replace(/-+/g, '-');
    }

    (async function() {
        var response = await fetch("{{ '/bug_data' | htmlBaseUrl }}");
        if (!response.ok) {throw new Error(`HTTP error! status: ${response.status}`);}

        var bug_data = await response.json();
        const index = getRandomIntInclusive(0, Object.keys(bug_data).length)

        gotoEntryPage(slugify(bug_data[index].id));
    })();
</script>
