<script>
    function getDaysSince(pastDateString) {
        const pastDate = new Date(pastDateString);
        const currentDate = new Date();

        // Convert both dates to UTC timestamps at midnight to ignore time-of-day differences
        const pastUTC = Date.UTC(pastDate.getFullYear(), pastDate.getMonth(), pastDate.getDate());
        const currentUTC = Date.UTC(currentDate.getFullYear(), currentDate.getMonth(), currentDate.getDate());

        const msPerDay = 1000 * 60 * 60 * 24;
        return Math.floor((currentUTC - pastUTC) / msPerDay);
    }

    // Seed generator (turns any string seed into a 128-bit state)
    function cyrb128(str) {
        let h1 = 1779033703, h2 = 3024734485, h3 = 3362625948, h4 = 502494848;
        for (let i = 0, k; i < str.length; i++) {
            k = str.charCodeAt(i);
            h1 = h2 ^ Math.imul(h1 ^ k, 597399067);
            h2 = h3 ^ Math.imul(h2 ^ k, 2869860233);
            h3 = h4 ^ Math.imul(h3 ^ k, 951274213);
            h4 = h1 ^ Math.imul(h4 ^ k, 2716044179);
        }
        h1 = Math.imul(h3 ^ (h1 >>> 18), 597399067);
        h2 = Math.imul(h4 ^ (h2 >>> 22), 2869860233);
        h3 = Math.imul(h1 ^ (h3 >>> 17), 951274213);
        h4 = Math.imul(h2 ^ (h4 >>> 19), 2716044179);
        return [(h1^h2^h3^h4)>>>0, (h2^h1)>>>0, (h3^h1)>>>0, (h4^h1)>>>0];
    }

    // Mulberry32 PRNG generator
    function mulberry32(a) {
        return function() {
        let t = a += 0x6D2B79F5;
        t = Math.imul(t ^ (t >>> 15), t | 1);
        t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        }
    }

    // Seeded array shuffle function (Fisher-Yates)
    function shuffleArray(array, seedString) {
        const seed = cyrb128(seedString);
        const random = mulberry32(seed[0]);
        
        const shuffled = [...array]; 
        
        for (let i = shuffled.length - 1; i > 0; i--) {
            const j = Math.floor(random() * (i + 1));
            [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
        }
        
        return shuffled;
    }

    (async function() {
        // Could build this list using a template, but might want to pull images from different places
        const images = ["{{ '/images/Cocoon.avif' | htmlBaseUrl }}", "{{ '/images/Hang In There.avif' | htmlBaseUrl }}", "{{ '/images/Camoflauge.avif' | htmlBaseUrl }}"];
        const shuffledImages = shuffleArray(images, "wallnut");
        const image = shuffledImages[getDaysSince("2026-01-01") % shuffledImages.length];

        const featuredImage = document.querySelector("#featured_image");
        if (image) {
            featuredImage.src=image;
        }
    })();
</script>
