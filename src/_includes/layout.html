<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="/images/favicon.ico" type="image/x-icon">
  <title>{{ title }} — Buggy Website</title>

  <script>
    // Load saved theme before displaying any content
    (function() {
      const savedTheme = localStorage.getItem('selected-theme');
      if (savedTheme) {
        document.documentElement.setAttribute('data-theme', savedTheme);
      }
    })();
  </script>

  <link rel="stylesheet" href="/css/bundle.css">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Changa+One:ital@0;1&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      font-family: system-ui, sans-serif;
      background-color: var(--border-color);
      /* background-image: linear-gradient(to bottom, var(--border-color) 200px, var(--bg-color) 400px); */
      min-height: 100dvh;
    }
    header {
      margin: 2rem auto;
      margin-top: 0;
      margin-bottom: 0;
    }
    main {
      overflow: auto;
      margin: 0;
      padding-left: 10px;
      padding-right: 10px;
      /* border-left: 1px solid #555;
      border-right: 1px solid #555;
      border-bottom: 1px solid #555; */
      background-color: var(--bg-color);
      min-height: 100dvh;
      /* If the background of the main area should be an image */
      /* background-image: url('/images/Coleoptera/american carrion beetle.avif');
      background-attachment: fixed;
      background-position: center;
      background-repeat: no-repeat;
      background-size: cover; */
    }
    .content-inner {
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;
    }
    .page-content {
      /* Start at max size, shrink if needed. If max size is reached, show sidebars */
      flex: 0 1 100%;
      min-width: 0;
      /* Adds a border around the whole page */
      /* margin: 1rem; */
    }
    .navbar {
      display: flex;
      width: auto;
      padding: 10px;
      gap: 20px;
      /* border: 1px solid #555; */
      background-color: var(--navbar-bg-color);
      /* justify-content: space-between; */
    }
    .navbar a {
      color: var(--navbar-text-color);
    }
    .navbar h1, h2 {
      margin: 0px;
      text-align: center;
    }
    .navbar-inner {
      display: flex;
      max-width: 1200px;
      width: 100%;
      margin: 0 auto;
    }
    /* Push options to a new line on small screens */
    @media (max-width: 768px) {
      .navbar-inner {
        display: block;
      }
    }
    .navbar-options {
      display: flex;
      gap: 1rem;
      align-self: flex-end;
      margin-left: auto;
    }
    .navbar-options h3 {
      margin: 0px;
    }
    .sidebar {
      flex: 1; /* Fill remaining space on the page */
      min-width: 0;
      background-color: #ff8a00;
      background-image: linear-gradient(to right, var(--sidebar-gradient-one), var(--sidebar-gradient-two));
    }
    .sidebar.right {
      background-image: linear-gradient(to left, var(--sidebar-gradient-one), var(--sidebar-gradient-two));
    }
  </style>
</head>
<body>
  <div style="display: flex; flex-grow: 1; ">
    <div class="sidebar"></div>
    <div class="page-content">
      <header class="navbar">
        <div class="navbar-inner">
          <h1 style="align-self: flex-start;">
            <a class="changa-one-regular" href="/">Buggy Website</a>
          </h1>
  
          <div class="navbar-options">

            <h3>
              <a href="/">Search</a>
            </h3>

            <h3>
              <a href="/about">About</a>
            </h3>
            
            <h3>
              <a href="/random">Random Bug</a>
            </h3>
              
            <input type="button" id="theme-toggle" style="display: none;">
              <label for="theme-toggle">
                <svg class="theme-toggle-label" fill="#000000" version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" 
                  width="32px" height="32px" viewBox="0 0 556.232 556.231"
                  xml:space="preserve">
                <g>
                  <g>
                    <path d="M222.136,314.367h147.081c-35.343-23.38-48.405-62.348-48.405-93.731c0-20.684,2.391-51.332,4.705-80.966
                      c1.94-24.815,3.768-48.243,3.768-61.372C329.284,47.124,316.651,0,297.613,0c-4.724,0-8.816,1.807-12.508,5.546
                      c-18.485,18.647-18.179,73.937-18.169,74.492c0,36.031,3.06,56.237,5.766,74.071c2.926,19.288,5.441,35.945,3.796,66.479
                      C273.658,272.56,242.427,301.161,222.136,314.367z"/>
                    <rect x="203.164" y="362.18" width="181.688" height="9.562"/>
                    <rect x="203.164" y="381.305" width="181.688" height="19.125"/>
                    <rect x="203.164" y="333.492" width="181.688" height="19.125"/>
                    <path d="M173.673,539.688c-1.721,1.233-2.639,3.634-2.171,5.709c0.65,2.936,4.017,5.154,9.209,6.101
                      c6.321,1.147,14.506,2.113,23.963,2.869c0.144,0,0.201-0.02,0.383-0.01c12.642,0.87,25.226-25.475,32.828-45.747
                      c0,0-3.586,28.582-8.482,47.124c8.788,0.315,18.035,0.497,27.635,0.497c39.8,0,75.009-2.754,94.2-7.363
                      c10.959-2.63,18.886-9.734,21.21-19.01c8.529-34.129,11.513-92.986,12.221-110.304H203.192
                      C203.135,440.392,201.117,520.085,173.673,539.688z"/>
                  </g>
                </g>
                </svg>
              </label>
          </div>
        </div>
      </header>
      <main>
        <div class="content-inner">
          {{ content | safe }}
        </div>
      </main>
    </div>
    <div class="sidebar right"></div>
  </div>
  
</body>

<script>
  const themes = ["Clean", "Slate", "Berry", "Fresh Greens", "Vibrant Nature", "Coastal Vibes", "Rustic Charm", "Mossy Woods", "Dark Berry", "Sea and Stars"];
  const savedTheme = localStorage.getItem("selected-theme");
  let currentThemeIndex = themes.indexOf(savedTheme) ?? 0;
  
  const themeToggleBtn = document.getElementById("theme-toggle");

  themeToggleBtn.addEventListener("click", () => {
    currentThemeIndex = (currentThemeIndex + 1) % themes.length;
    const nextTheme = themes[currentThemeIndex];
  
    document.documentElement.setAttribute("data-theme", nextTheme);
  
    // Save preference in localStorage
    localStorage.setItem("selected-theme", nextTheme);
  });
</script>
</html>
