<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ title }} — My Catalog</title>
  <style>
    body {
      max-width: 1100px;
      margin: 2rem auto;
      padding: 0 1rem;
      font-family: system-ui, sans-serif;
    }
    .grid {
      display: grid;
      grid-template-columns:
        repeat(auto-fit, minmax(230px, 1fr));
      gap: 1rem;
    }
    .card {
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 1rem;
    }
    .card img, .detail-image {
      width: 100%;
      height: 190px;
      object-fit: cover;
      border-radius: 5px;
    }
    .tags {
      color: #555;
      font-size: 0.9rem;
    }
    input, select {
      padding: 0.7rem;
      margin: 0.5rem 0.5rem 1rem 0;
    }
  </style>
</head>
<body>
  <header>
    <a href="/">My Catalog</a>
  </header>
  <main>
    {{ content | safe }}
  </main>
</body>
</html>
