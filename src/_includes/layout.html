<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ title }} — Buggy Website</title>
  <style>
    body {
      margin: 0;
      font-family: system-ui, sans-serif;
      background-color: #dededeff;
      min-height: 100dvh;
    }
    header {
      /* max-width: 1100px; */
      margin: 2rem auto;
      margin-top: 0;
      margin-bottom: 0;
    }
    main {
      overflow: auto;
      /* max-width: 1100px; */
      margin: 0;
      padding-left: 10px;
      padding-right: 10px;
      border-left: 1px solid #555;
      border-right: 1px solid #555;
      background-color: #dededeff;
      min-height: 100dvh;
    }
    .page-content {
      flex: 0 1 1100px; /* Start at max size, shrink if needed */
      min-width: 0;
    }
    .navbar {
      display: flex;
      width: auto;
      padding: 10px;
      gap: 20px;
      border: 1px solid #555;
      background-color: #e8dbf0ff;
    }
    .sidebar {
      flex: 1; /* Fill remaining space on the page */
      min-width: 0;
      background-color: #ff8a00;
      background-image: linear-gradient(to right, #9341ff, #aa60ff);
    }
    .sidebar.right {
      background-image: linear-gradient(to left, #9341ff, #aa60ff);
    }
    .grid {
      display: grid;
      grid-template-columns:
        repeat(auto-fit, minmax(230px, 1fr));
      gap: 1rem;
    }
    .card {
      /* border: 1px solid #ddd; */
      /* border-radius: 8px; */
      padding: 1rem;
      border-bottom: 1px solid #ccc;
    }
    .card img, .detail-image {
      width: 100%;
      height: 190px;
      object-fit: cover;
      border-radius: 5px;
    }
    .tags {
      color: #555;
      font-size: 0.9rem;
    }
    input, select {
      padding: 0.7rem;
      margin: 0.5rem 0.5rem 1rem 0;
    }
  </style>
</head>
<body>
  <div style="display: flex; flex-grow: 1; ">
    <div class="sidebar"></div>
    <div class="page-content">
      <header class="navbar">
        <a href="/">Buggy Website</a>
        <a style="margin-left: auto;" href="/About">About</a>
        <a href="/">\_o_/</a>
      </header>
      <main>
        {{ content | safe }}
      </main>
    </div>
    <div class="sidebar right"></div>
  </div>
  
</body>
</html>
