---
layout: layout.html
title: Search
---

{% from "src/_includes/macros.njk" import bugCard %}

<h1 class="changa-one-regular">Search the Bug Catalog</h1>

<!-- <label for="category">Category</label> -->
<select id="category">
  <option value="">All</option>
  <!-- <option value="Blattodea">Cockroaches and Termites (Blattodea)</option> -->
  <option value="Coleoptera">Beetles (Coleoptera)</option>
  <option value="Dermaptera">Earwigs (Dermaptera)</option>
  <option value="Diptera">Flies (Diptera)</option>
  <option value="Embioptera">Webspinners (Embioptera)</option>
  <option value="Ephemeroptera">Mayflies (Ephemeroptera)</option>
  <option value="Hemiptera">True Bugs (Hemiptera)</option>
  <option value="Hymenoptera">Bees, Wasps & Ants (Hymenoptera)</option>
  <option value="Lepidoptera">Butterflies and Moths (Lepidoptera)</option>
  <option value="Mantodea">Praying Mantids (Mantodea)</option>
  <option value="Mecoptera">Scorpionflies, Hangingflies & Allies (Mecoptera)</option>
  <option value="Megaloptera">Alderflies, Dobsonflies & Fishflies (Megaloptera)</option>
  <option value="Neuroptera">Antlions, Lacewings & Mantidflies (Neuroptera)</option>
  <option value="Odonata">Dragonflies and Damselflies (Odonata)</option>
  <option value="Orthoptera">Grasshoppers, Crickets & Katydids (Orthoptera)</option>
  <option value="Phasmatodea">Stick and Leaf Insects (Phasmatodea)</option>
  <option value="Plecoptera">Stoneflies (Plecoptera)</option>
  <option value="Psocodea">Barklice, Booklice & Parasitic Lice (Psocodea)</option>
  <option value="Trichoptera">Caddisflies (Trichoptera)</option>
  <option value="Zygentoma">Silverfish and Firebrats (Zygentoma)</option>
  <option value="Araneae">Spiders (Araneae)</option>
  <option value="Chilopoda">Centipedes (Chilopoda)</option>
  <option value="Diplopoda">Millipedes (Diplopoda)</option>

  {# 
    Adds an option for every order in the data
    Might as well just use a manual list since I need to write common names anyway
  {% set known_orders = [] %}
  {% for entry in entries %}
    {% if entry.order and entry.order not in known_orders %}
      {% set known_orders = (known_orders.push(entry.order), known_orders) %}
      <option value="{{ entry.order }}">
        {{ entry.order }}
      </option>
    {% endif %}
  {% endfor %}
  #}
</select>

<!-- <label for="search">Search entries</label> -->
<input
  id="search"
  type="search"
  placeholder="Search..."
>

<label for="sort">Sorted By</label>
<select id="sort" style="margin-left: auto;"">
  <option value="">N/A</option>
  <option value="Date">Date</option>
  <option value="Name">Name</option>
  <option value="Group">By Group</option>
</select>

<p style="display: inline;">:</p>

<select id="sort-order" style="margin-left: auto;"">
  <option value="Ascending">Asc</option>
  <option value="Descending">Desc</option>
</select>

<!-- <label class="custom-checkbox">
  <input type="checkbox" id="sort-order" name="Ascending" checked=true>
  <span class="checkbox-icon"></span>
</label> -->

<p id="count" aria-live="polite"></p>

<div class="search-results-grid" id="results">
  {% for entry in entries %}
    {{ bugCard(entry=entry) }}
  {% endfor %}
</div>

<script>
  const search = document.querySelector("#search");
  const category = document.querySelector("#category");
  const sort = document.querySelector("#sort");
  const sortOrder = document.querySelector("#sort-order");
  const cards = [...document.querySelectorAll(".search-result-card")];
  const count = document.querySelector("#count");
  const container = cards[0]?.parentElement;

  function mostRecentDate(dateString) {
    // Requires dates in YYYY-MM format separated by ','
    const dates = dateString.split(',');
    dates.pop(); // Remove empty string from trailing ','
    let mostRecent = new Date(1900, 0, 0);
    for (const date of dates) {
      const [year, month] = date.split('-');
      thisDate = new Date(year, month-1, 0);
      if (thisDate > mostRecent) {
        mostRecent = thisDate;
      }
    }
    return mostRecent;
  }

  function filterEntries() {
    const query = search.value.trim().toLowerCase();
    const selectedCategory = category.value;
    const sortingCriteria = sort.value;
    const sortingOrder = sortOrder.value == "Ascending";
    let visible = 0;

    const sortedCards = [...cards].sort((a, b) => {
      switch (sortingCriteria) {
        case "Date": {
          const result = mostRecentDate(a.dataset.dates) > mostRecentDate(b.dataset.dates);
          return result !== sortingOrder;
          break;
        }
        case "Name": {
          const result = a.dataset.name.localeCompare(b.dataset.name);
          return sortingOrder ? result : -result
          break;
        }
        case "Group": {
          return true !== sortingOrder; // TODO subgroup
        }
      }
    });

    for (const card of sortedCards) {
      const text = [
        card.dataset.name,
        card.dataset.sci,
        card.dataset.category,
        card.dataset.sub_category,
        card.dataset.tags
      ].join(" ").toLowerCase();

      const matchesText = text.includes(query);
      const matchesCategory =
        !selectedCategory ||
        card.dataset.category === selectedCategory;

      const show = matchesText && matchesCategory;
      card.hidden = !show;

      container.appendChild(card);

      if (show) visible++;
    }

    count.textContent = `${visible} entries found`;
  }

  search.addEventListener("input", filterEntries);
  category.addEventListener("change", filterEntries);
  sort.addEventListener("change", filterEntries);
  sortOrder.addEventListener("change", filterEntries);
  filterEntries();
</script>
