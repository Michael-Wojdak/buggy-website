---
layout: layout.html
title: Catalog
---

{% from "src/macros.njk" import bugCard %}

<h1>Search the Bug Catalog</h1>

<label for="search">Search entries</label>
<input
  id="search"
  type="search"
  placeholder="Search titles, descriptions, tags..."
>

<label for="category">Category</label>
<select id="category">
  <option value="">All</option>
  <option value="Araneae">Spiders (Araneae)</option>
  <option value="Chilopoda">Centipedes (Chilopoda)</option>
  <option value="Coleoptera">Beetles (Coleoptera)</option>

  {# 
    Adds an option for every order in the data
    Might as well just use a manual list since I need to write common names anyway
  {% set known_orders = [] %}
  {% for entry in entries %}
    {% if entry.order and entry.order not in known_orders %}
      {% set known_orders = (known_orders.push(entry.order), known_orders) %}
      <option value="{{ entry.order }}">
        {{ entry.order }}
      </option>
    {% endif %}
  {% endfor %}
  #}
</select>

<p id="count" aria-live="polite"></p>

<div class="grid" id="results">
  {% for entry in entries %}
    {{ bugCard(entry=entry) }}
  {% endfor %}
</div>

<script>
  const search = document.querySelector("#search");
  const category = document.querySelector("#category");
  const cards = [...document.querySelectorAll(".card")];
  const count = document.querySelector("#count");

  function filterEntries() {
    const query = search.value.trim().toLowerCase();
    const selectedCategory = category.value;
    let visible = 0;

    for (const card of cards) {
      const text = [
        card.dataset.name,
        card.dataset.category,
        card.dataset.sub_category,
        card.dataset.tags
      ].join(" ").toLowerCase();

      const matchesText = text.includes(query);
      const matchesCategory =
        !selectedCategory ||
        card.dataset.category === selectedCategory;
      
      console.log(card.dataset.category);

      const show = matchesText && matchesCategory;
      card.hidden = !show;

      if (show) visible++;
    }

    count.textContent = `${visible} entries found`;
  }

  search.addEventListener("input", filterEntries);
  category.addEventListener("change", filterEntries);
  filterEntries();
</script>
